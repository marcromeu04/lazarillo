<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazarillo</title>
<style>
  :root{ --bg:#0b0d12; --panel:#13161f; --panel2:#1a1e2b; --line:#262b3a; --txt:#e7e9f0; --dim:#8a90a6; --acc:#a855f7; --acc2:#6366f1; --green:#34d399; --amber:#fbbf24; --red:#f87171; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .loc{flex:1;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc b{color:var(--acc)}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--acc2);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:700}
  .btn:hover{filter:brightness(1.1)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-weight:500}
  .main{display:flex;height:calc(100% - 55px)}
  .left{width:68%;border-right:1px solid var(--line);background:#fff}
  iframe{width:100%;height:100%;border:0;display:block}
  .right{width:32%;display:flex;flex-direction:column;background:var(--panel)}
  .orbWrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px}
  .dot{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,var(--acc2));box-shadow:0 0 40px rgba(99,102,241,.5);transition:.2s}
  .dot.connect{animation:spin 1.1s linear infinite;background:radial-gradient(circle at 35% 30%,#fde68a,#d97706)}
  .dot.listen{background:radial-gradient(circle at 35% 30%,#86efac,#059669);box-shadow:0 0 40px rgba(52,211,153,.6);animation:breathe 1.4s infinite}
  .dot.speak{background:radial-gradient(circle at 35% 30%,#c4b5fd,var(--acc));animation:breathe .7s infinite}
  .dot.error{background:radial-gradient(circle at 35% 30%,#fca5a5,#dc2626)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}} @keyframes spin{to{transform:rotate(360deg)}}
  .state{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  #warnbox{display:none;margin:0 14px;padding:8px 10px;background:#3b1d1d;border:1px solid #7f1d1d;border-radius:8px;color:#fca5a5;font-size:12px}
  .log{flex:1;overflow:auto;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums}
  .log .row{display:flex;gap:8px;padding:2px 0}
  .log .t{color:#4b5163} .log .k{font-weight:700;min-width:96px}
  .k.evt{color:#93c5fd} .k.info{color:#86efac} .k.tool{color:#f0abfc} .k.err{color:#fca5a5}
  .log .m{color:var(--dim);word-break:break-word}
  .hint{font-size:12px;color:var(--dim);text-align:center;padding:4px 14px}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Lazarillo</span>
  <div class="loc" id="loc">📍 cargando la web…</div>
  <button class="btn" id="btnStart">Empezar demo</button>
  <button class="btn ghost" id="btnStop" disabled>Colgar</button>
</div>
<div class="main">
  <div class="left"><iframe id="site" referrerpolicy="no-referrer"></iframe></div>
  <div class="right">
    <div class="orbWrap">
      <div class="dot" id="dot"></div>
      <div class="state" id="statusText">en reposo</div>
    </div>
    <div class="hint">Pulsa <b>Empezar demo</b>, permite el micro y usa <b>cascos</b>. Háblale: «¿cómo llego a los libros de viajes?»</div>
    <div id="warnbox"></div>
    <div class="log" id="log"></div>
  </div>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
