<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazarillo</title>
<style>
  :root{ --bg:#0b0d12; --panel:#13161f; --panel2:#1a1e2b; --line:#262b3a; --txt:#e7e9f0; --dim:#8a90a6; --acc:#a855f7; --acc2:#6366f1; --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .loc{flex:1;min-width:0;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc b{color:var(--acc)}
  .site{display:flex;gap:6px;align-items:center}
  .site input{width:240px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .site input:focus{outline:2px solid var(--acc2);outline-offset:0}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--acc2);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:700}
  .btn:hover{filter:brightness(1.1)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-weight:500}
  .btn.ghost:not(:disabled):hover{color:var(--txt)}
  .main{display:flex;height:calc(100% - 57px)}
  .left{width:64%;border-right:1px solid var(--line);background:#fff}
  iframe{width:100%;height:100%;border:0;display:block}
  .right{width:36%;min-width:320px;display:flex;flex-direction:column;background:var(--panel)}
  .orbWrap{display:flex;align-items:center;gap:14px;padding:12px 14px}
  .dot{flex:none;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,var(--acc2));box-shadow:0 0 30px rgba(99,102,241,.5);transition:.2s}
  .dot.connect{animation:spin 1.1s linear infinite;background:radial-gradient(circle at 35% 30%,#fde68a,#d97706)}
  .dot.listen{background:radial-gradient(circle at 35% 30%,#86efac,#059669);box-shadow:0 0 30px rgba(52,211,153,.6);animation:breathe 1.4s infinite}
  .dot.speak{background:radial-gradient(circle at 35% 30%,#c4b5fd,var(--acc));animation:breathe .7s infinite}
  .dot.error{background:radial-gradient(circle at 35% 30%,#fca5a5,#dc2626)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}} @keyframes spin{to{transform:rotate(360deg)}}
  .state{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .hint{font-size:12px;color:var(--dim)}
  #warnbox{display:none;margin:0 14px 8px;padding:8px 10px;background:#3b1d1d;border:1px solid #7f1d1d;border-radius:8px;color:#fca5a5;font-size:12px}
  .sec{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel2);display:flex;justify-content:space-between;gap:8px}
  .log{flex:1;min-height:110px;overflow:auto;padding:6px 12px;font-size:12px;font-variant-numeric:tabular-nums}
  .log .row{display:flex;gap:8px;padding:2px 0}
  .log .t{color:#4b5163} .log .k{font-weight:700;min-width:84px}
  .k.evt{color:#93c5fd} .k.info{color:#86efac} .k.tool{color:#f0abfc} .k.err{color:#fca5a5} .k.you{color:#fde68a} .k.ia{color:#c4b5fd} .k.map{color:#5eead4}
  .log .m{color:var(--dim);word-break:break-word} .log .row.say .m{color:var(--txt)}
  /* grafo */
  .graphBox{height:46%;min-height:230px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .ghead{font-size:12px;color:var(--dim);padding:6px 12px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghead b{color:var(--txt)} .gcur{color:var(--acc);font-weight:700}
  #graph{flex:1;width:100%;display:block;background:radial-gradient(circle at 50% 40%,#151a28,#0d1018)}
  #ginfo{font-size:12px;color:var(--dim);padding:6px 12px;min-height:44px;border-top:1px solid var(--line)}
  #ginfo b{color:var(--txt)} .gpath{color:#5b6278} .gdeep{color:var(--green)}
  .glegend{display:flex;gap:10px;font-size:11px;color:#5b6278;padding:0 12px 6px}
  .glegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .ge{fill:none;stroke:#3b4360;stroke-width:1.2;opacity:.75} .ge.out{stroke:#6366f1;opacity:.9;stroke-width:1.6} .ge.extra{stroke:#6366f1;opacity:.35;stroke-dasharray:3 3}
  .gtrail{fill:none;stroke:var(--acc);stroke-width:2.6;opacity:.95;stroke-linecap:round}
  .gnode.root .gn{fill:#e7e9f0} .gnode.root .gl{fill:var(--txt);font-weight:700}
  .gn{fill:#475569;stroke:#0b0d12;stroke-width:1.5;transition:fill .2s}
  .gring{fill:none;stroke:transparent;stroke-width:2}
  .gl{fill:#8a90a6;font-size:10px;pointer-events:none;paint-order:stroke;stroke:#0d1018;stroke-width:3px}
  .gnode{cursor:default}
  .gnode.next .gn{fill:#64748b} .gnode.vis .gn{fill:var(--acc2)} .gnode.live .gn{stroke:var(--blue)}
  .gnode.ready .gring{stroke:rgba(52,211,153,.55)}
  .gnode.inv .gring{stroke:var(--amber);stroke-dasharray:3 3;animation:gspin 1s linear infinite;transform-box:fill-box;transform-origin:center}
  .gnode.prob .gring{stroke:var(--blue);stroke-dasharray:2 2;stroke-width:2.5}
  .gnode.cur .gn{fill:var(--acc);r:9} .gnode.cur .gring{stroke:var(--acc);stroke-dasharray:none;animation:gpulse 1.2s ease-in-out infinite}
  .gnode.cur .gl,.gnode.vis .gl{fill:var(--txt);font-weight:600}
  .gnode:hover .gl{display:inline!important;fill:#fff}
  @keyframes gspin{to{transform:rotate(360deg)}} @keyframes gpulse{0%,100%{stroke-width:2;opacity:1}50%{stroke-width:5;opacity:.4}}
  .gnode.hot .gn{fill:#f59e0b} .ghot{color:#f59e0b;font-weight:700}
  .rep{color:var(--dim);text-decoration:none;margin-left:8px} .rep:hover{color:var(--txt)}
  .gprob{color:var(--blue);text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .sec>span:first-child{flex:none}

  /* panel de KPIs */
  .dash{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
  .dash[hidden]{display:none}
  .dcard{width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .dhead{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  .dkicker{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .dtitle{font-size:18px;font-weight:700}
  .dtabs{margin-left:auto;display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .dtabs button{background:none;border:0;color:var(--dim);padding:6px 12px;border-radius:7px;font-size:13px}
  .dtabs button[aria-selected=true]{background:var(--acc2);color:#fff}
  .dclose{background:none;border:0;color:var(--dim);font-size:26px;line-height:1;padding:0 4px}
  .dclose:hover{color:var(--txt)}
  .dbody{padding:18px 20px 22px}
  .dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .dtile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .dlabel{font-size:12px;color:var(--dim)} .dvalue{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
  .dsub{font-size:12px;color:var(--dim);font-weight:400}
  .dtile .dsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dresumen{margin:14px 0 4px;color:var(--txt);font-size:14px;line-height:1.55}
  .dgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;margin-top:12px}
  @media (max-width:760px){.dgrid{grid-template-columns:1fr}}
  .dgrid h3{font-size:13px;margin:14px 0 8px;color:var(--txt)} .dgrid section>h3:first-child{margin-top:4px}
  .dbars{display:flex;flex-direction:column;gap:2px}
  .dbar{display:grid;grid-template-columns:minmax(0,38%) 1fr 34px;align-items:center;gap:10px;padding:4px 0;cursor:default}
  .dbar:hover .dbl{color:var(--txt)} .dbar:hover .dfill{filter:brightness(1.15)}
  .dbl{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dtrack{height:14px;display:flex;align-items:center}
  .dfill{height:12px;background:#8b5cf6;border-radius:0 4px 4px 0}
  .dbv{font-size:12px;color:var(--txt);font-variant-numeric:tabular-nums;text-align:right}
  .dquotes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .dquotes li{font-size:13px;color:var(--txt);background:var(--panel2);border-left:3px solid var(--line);border-radius:6px;padding:7px 10px;line-height:1.45}
  .dchips{display:flex;flex-wrap:wrap;gap:6px} .dchips span{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .dnext{margin-top:16px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.35);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
  .dempty{font-size:13px;color:var(--dim)}
  .dtip{position:fixed;z-index:60;pointer-events:none;background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--txt);max-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Lazarillo</span>
  <div class="loc" id="loc">📍 cargando la web…</div>
  <form class="site" id="siteForm">
    <input id="siteUrl" type="url" placeholder="https://cualquier-web.com" autocomplete="off" aria-label="Web a explorar">
    <button class="btn ghost" id="btnExplore" type="submit">Explorar</button>
  </form>
  <button class="btn" id="btnStart">Empezar demo</button>
  <button class="btn ghost" id="btnStop" disabled>Colgar</button>
</div>
<div class="main">
  <div class="left"><iframe id="site" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation"></iframe></div>
  <div class="right">
    <div class="orbWrap">
      <div class="dot" id="dot"></div>
      <div>
        <div class="state" id="statusText">en reposo</div>
        <div class="hint">Pulsa <b>Empezar demo</b>, permite el micro y usa <b>cascos</b>. Dile qué quieres ver: la IA te lleva.</div>
      </div>
    </div>
    <div id="warnbox"></div>
    <div class="sec"><span>Llamada y agentes<a class="rep" href="#" id="btnReport" title="Panel de interés: esta sesión y todas">informe ▸</a></span><span id="predict" class="gprob"></span></div>
    <div class="log" id="log"></div>
    <div class="graphBox">
      <div class="ghead" id="ghead"><b>Grafo</b></div>
      <svg id="graph" aria-label="Grafo de la web"></svg>
      <div class="glegend"><span><i style="background:#a855f7"></i>IA aquí</span><span><i style="background:#6366f1"></i>visitada</span><span><i style="border:2px dashed #fbbf24"></i>investigando</span><span><i style="border:2px solid rgba(52,211,153,.7)"></i>detalle listo</span><span><i style="border:2px dashed #60a5fa"></i>probable</span></div>
      <div id="ginfo"></div>
    </div>
  </div>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
