<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazarillo</title>
<style>
  :root{
    --bg:#0a0c11; --panel:#11141c; --panel2:#171b26; --panel3:#1d2230; --line:#232838; --line2:#2d3346;
    --txt:#e8eaf1; --dim:#8b91a7; --faint:#5b6278;
    --acc:#a855f7; --acc2:#6366f1; --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
    --side:420px; --topH:60px; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer;color:inherit}
  kbd{font:11px/1 ui-monospace,Consolas,monospace;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:2px 4px;margin-left:6px}

  /* ---------- barra superior ---------- */
  .top{height:var(--topH);display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brandwrap{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
  .brand{flex:none;font-weight:800;font-size:19px;letter-spacing:-.2px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .loc{min-width:0;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .loc b{color:var(--txt);font-weight:600}
  .views{flex:none;display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .views button{background:none;border:0;color:var(--dim);padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;display:flex;align-items:center}
  .views button:hover{color:var(--txt)}
  .views button[aria-selected=true]{background:var(--acc2);color:#fff}
  .views button[aria-selected=true] kbd{color:#c7d2fe;border-color:rgba(255,255,255,.3)}
  .actions{flex:none;display:flex;align-items:center;gap:8px}
  .site{display:flex;gap:6px;align-items:center}
  .site input{width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 11px;font:inherit;font-size:13px}
  .site input:focus{outline:2px solid var(--acc2);outline-offset:0}
  .btn{background:var(--acc2);color:#fff;border:none;padding:8px 15px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap}
  .btn:hover{filter:brightness(1.12)} .btn:disabled{opacity:.45;cursor:default;filter:none}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-weight:600}
  .btn.ghost:not(:disabled):hover{color:var(--txt)}
  .icon{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:17px;line-height:1}
  .icon:hover{color:var(--txt)} .icon.sm{width:28px;height:28px;font-size:14px;border-radius:8px}

  /* ---------- escenario y vistas ---------- */
  .stage{position:relative;height:calc(100vh - var(--topH));display:grid;grid-template-columns:minmax(0,1fr) var(--side);background:var(--bg)}
  .stage:fullscreen{height:100vh}
  .pane-web{min-width:0;background:#fff;position:relative}
  iframe{width:100%;height:100%;border:0;display:block}
  .side{min-width:0;display:flex;flex-direction:column;gap:12px;padding:12px;border-left:1px solid var(--line);background:var(--panel);overflow:hidden}
  .pane-dash{display:none;overflow:auto}
  /* la web oculta conserva su tamaño: el puente sigue midiendo y moviendo la página igual */
  .stage[data-view=graph] .pane-web,.stage[data-view=chat] .pane-web,.stage[data-view=panel] .pane-web{position:absolute;left:0;top:0;bottom:0;width:calc(100% - var(--side));visibility:hidden;pointer-events:none;z-index:-1}
  .stage[data-view=web]{grid-template-columns:minmax(0,1fr)}
  .stage[data-view=web] .side{display:none}
  .stage[data-view=graph],.stage[data-view=chat]{grid-template-columns:minmax(0,1fr)}
  .stage[data-view=graph] .side,.stage[data-view=chat] .side{border-left:0;padding:16px 20px}
  .stage[data-view=graph] .chatcard{display:none}
  .stage[data-view=chat] .graphcard{display:none}
  .stage[data-view=graph] .callcard,.stage[data-view=chat] .callcard{max-width:900px;width:100%;margin:0 auto}
  .stage[data-view=chat] .chatcard{max-width:900px;width:100%;margin:0 auto}
  .stage[data-view=chat] .chat{font-size:17px;padding:10px 22px}
  .stage[data-view=panel]{grid-template-columns:minmax(0,1fr)}
  .stage[data-view=panel] .side{display:none}
  .stage[data-view=panel] .pane-dash{display:block}

  /* ---------- llamada ---------- */
  .callcard{flex:none;display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .dot{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,var(--acc2));box-shadow:0 0 26px rgba(99,102,241,.45);transition:.2s}
  .dot.sm{width:22px;height:22px;box-shadow:0 0 12px rgba(99,102,241,.5)}
  .dot.connect{animation:spin 1.1s linear infinite;background:radial-gradient(circle at 35% 30%,#fde68a,#d97706)}
  .dot.listen{background:radial-gradient(circle at 35% 30%,#86efac,#059669);box-shadow:0 0 26px rgba(52,211,153,.55);animation:breathe 1.4s infinite}
  .dot.speak{background:radial-gradient(circle at 35% 30%,#c4b5fd,var(--acc));animation:breathe .7s infinite}
  .dot.error{background:radial-gradient(circle at 35% 30%,#fca5a5,#dc2626)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}} @keyframes spin{to{transform:rotate(360deg)}}
  .callinfo{min-width:0}
  .state{font-size:12px;font-weight:700;color:var(--txt);text-transform:uppercase;letter-spacing:1.2px}
  .hint{font-size:13px;color:var(--dim);line-height:1.45}
  #warnbox{display:none;flex:none;padding:9px 12px;background:#3b1d1d;border:1px solid #7f1d1d;border-radius:10px;color:#fca5a5;font-size:13px}

  /* ---------- tarjetas del lateral ---------- */
  .card{min-height:0;display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .chatcard{flex:1 1 55%}
  .graphcard{flex:1 1 45%}
  .stage[data-view=graph] .graphcard,.stage[data-view=chat] .chatcard{flex:1 1 auto}
  /* Demo: la conversación se lleva el espacio que sobra; el grafo, una altura fija que siempre se lee */
  .stage[data-view=demo] .chatcard{flex:1 1 0}
  .stage[data-view=demo] .graphcard{flex:none}
  .stage[data-view=demo] #graph{flex:none;height:clamp(150px,30vh,320px)}
  .stage[data-view=demo] .glegend{display:none}
  .stage[data-view=demo] #ginfo{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
  .stage[data-view=demo] .hint{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cardhead{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);min-width:0}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
  .seg button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px}
  .seg button[aria-selected=true]{background:var(--panel3);color:var(--txt)}
  .rep{margin-left:auto;font-size:12px;color:var(--dim);text-decoration:none;white-space:nowrap} .rep:hover{color:var(--txt)}

  /* conversación */
  .chat{flex:1;overflow:auto;padding:8px 14px;font-size:14.5px;scroll-behavior:smooth}
  .empty{color:var(--faint);font-size:13px;text-align:center;padding:30px 16px;line-height:1.6}
  .msg{display:flex;gap:10px;margin:12px 0;align-items:flex-start}
  .msg .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
  .msg.ia .av{background:linear-gradient(135deg,var(--acc),var(--acc2))}
  .msg.you{flex-direction:row-reverse}
  .msg.you .av{background:#334155}
  .msg .body{max-width:84%;min-width:0}
  .msg .meta{font-size:11px;color:var(--faint);margin:0 4px 3px}
  .msg.you .meta{text-align:right}
  .msg .bub{padding:9px 13px;border-radius:16px;background:var(--panel3);line-height:1.55;word-wrap:break-word}
  .msg.ia .bub{border-top-left-radius:5px}
  .msg.you .bub{background:#243150;border-top-right-radius:5px}
  .note{display:flex;justify-content:center;margin:10px 0}
  .note span{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note.nav span{color:#c4b5fd;border-color:rgba(168,85,247,.35)}

  /* actividad técnica */
  .log{flex:1;overflow:auto;padding:8px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .log[hidden]{display:none}
  .log .row{display:flex;gap:8px;padding:2px 0}
  .log .t{color:#4b5163;flex:none} .log .k{font-weight:700;min-width:96px;flex:none}
  .k.evt{color:#93c5fd} .k.info{color:#86efac} .k.tool{color:#f0abfc} .k.err{color:#fca5a5} .k.you{color:#fde68a} .k.ia{color:#c4b5fd} .k.map{color:#5eead4}
  .log .m{color:var(--dim);word-break:break-word}

  /* grafo */
  .ghead{min-width:0;flex:1;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghead b{color:var(--txt)} .gcur{color:var(--acc);font-weight:700}
  #graph{flex:1;min-height:0;width:100%;display:block;background:radial-gradient(circle at 50% 35%,#151a28,#0d1018)}
  .gfoot{flex:none;border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
  .gprob{font-size:12px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
  .gprob:empty::before{content:'Predicción: aparecerá cuando hable el visitante';color:var(--faint)}
  #ginfo{font-size:12.5px;color:var(--dim);min-height:38px;line-height:1.5}
  #ginfo b{color:var(--txt)} .gpath{color:#5b6278} .gdeep{color:var(--green)}
  .glegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--faint)}
  .glegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .ge{fill:none;stroke:#3b4360;stroke-width:1.2;opacity:.75} .ge.out{stroke:#6366f1;opacity:.9;stroke-width:1.6} .ge.extra{stroke:#6366f1;opacity:.35;stroke-dasharray:3 3}
  .gtrail{fill:none;stroke:var(--acc);stroke-width:2.6;opacity:.95;stroke-linecap:round}
  .gnode.root .gn{fill:#e7e9f0} .gnode.root .gl{fill:var(--txt);font-weight:700}
  .gn{fill:var(--gc,#475569);stroke:#0b0d12;stroke-width:1.5;transition:fill .2s}
  /* buscador y capas */
  .gsearch{width:190px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px}
  .gsearch:focus{outline:2px solid var(--acc2);outline-offset:0}
  .stage[data-view=demo] .gsearch{display:none}
  .stage[data-view=demo] .graphcard .seg button{padding:4px 7px;font-size:11px}
  /* capa de conceptos */
  .cnode{cursor:pointer}
  .cnode rect{stroke:#0b0d12;stroke-width:1.5}
  .cl{fill:#a3a9bd;font-size:10.5px;paint-order:stroke;stroke:#0d1018;stroke-width:3px}
  #graph.big .cl{font-size:12.5px}
  .cnode.on .cl,.cnode.focus .cl,.cnode.pin .cl{fill:#fff;font-weight:600}
  .cnode.focus rect,.cnode.pin rect{stroke:#fff;stroke-width:2}
  .chead{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
  #graph.big .chead{font-size:11.5px}
  .ce{fill:none;stroke:#8b93ad;stroke-width:1;stroke-dasharray:3 3;opacity:.16}
  .ce.on{opacity:.85;stroke:#e2e8f0;stroke-width:1.4}
  .pc{fill:none;stroke:#94a3b8;stroke-width:1;opacity:.45}
  .pc.strong{opacity:.8;stroke:#cbd5e1}
  .gnode.dim,.cnode.dim{opacity:.15}
  .gnode.match .gring,.cnode.match rect{stroke:#fff;stroke-width:2.5}
  .gnode.pin .gring{stroke:#fff;stroke-dasharray:none}
  .ctype,.ggroup{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-left:6px}
  .glegend i.sq{border-radius:2px}
  .glegend i.ln{width:14px;height:0;border-radius:0;border-top:1.5px dashed #8b93ad}
  .gring{fill:none;stroke:transparent;stroke-width:2}
  .gl{fill:#8a90a6;font-size:10px;pointer-events:none;paint-order:stroke;stroke:#0d1018;stroke-width:3px}
  #graph.big .gl{font-size:12.5px;stroke-width:4px}
  #graph.big .gn{stroke-width:2}
  .gnode{cursor:pointer}
  .gnode.next .gn{fill:#64748b} .gnode.vis .gn{fill:var(--acc2)} .gnode.live .gn{stroke:var(--blue)}
  .gnode.ready .gring{stroke:rgba(52,211,153,.55)}
  .gnode.inv .gring{stroke:var(--amber);stroke-dasharray:3 3;animation:gspin 1s linear infinite;transform-box:fill-box;transform-origin:center}
  .gnode.prob .gring{stroke:var(--blue);stroke-dasharray:2 2;stroke-width:2.5}
  .gnode.cur .gn{fill:var(--acc);r:9} .gnode.cur .gring{stroke:var(--acc);stroke-dasharray:none;animation:gpulse 1.2s ease-in-out infinite}
  .gnode.cur .gl,.gnode.vis .gl{fill:var(--txt);font-weight:600}
  .gnode.pin .gl{fill:#fff}
  .gnode:hover .gl{display:inline!important;fill:#fff}
  @keyframes gspin{to{transform:rotate(360deg)}} @keyframes gpulse{0%,100%{stroke-width:2;opacity:1}50%{stroke-width:5;opacity:.4}}
  .gnode.hot .gn{fill:#f59e0b} .ghot{color:#f59e0b;font-weight:700}
  .stage[data-view=graph] #ginfo{font-size:14px;min-height:46px}
  .stage[data-view=graph] .gprob{font-size:13px}

  /* píldora de la llamada (vistas sin lateral) */
  .pill{position:absolute;left:16px;bottom:16px;z-index:5;display:none;align-items:center;gap:10px;max-width:min(560px,calc(100% - 32px));background:rgba(17,20,28,.92);backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:999px;padding:7px 16px 7px 8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .stage[data-view=web] .pill,.stage[data-view=panel] .pill{display:flex}
  .pilltext{font-size:13px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pilltext small{color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-size:10.5px;font-weight:700;margin-right:8px}

  /* barra flotante en pantalla completa */
  .fsbar,.fshot{display:none}
  .stage:fullscreen .fshot{display:block;position:absolute;top:0;left:0;right:0;height:14px;z-index:19}
  .stage:fullscreen .fsbar{display:flex;position:absolute;top:10px;left:50%;transform:translate(-50%,-140%);z-index:20;gap:4px;background:rgba(17,20,28,.94);border:1px solid var(--line2);border-radius:12px;padding:4px;transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .stage:fullscreen .fsbar.show,.stage:fullscreen .fsbar:hover{transform:translate(-50%,0)}
  .fsbar button{background:none;border:0;color:var(--dim);font-size:13px;font-weight:600;padding:6px 11px;border-radius:8px}
  .fsbar button[aria-selected=true]{background:var(--acc2);color:#fff}
  .fsbar .exit{color:var(--txt);border-left:1px solid var(--line2);border-radius:0 8px 8px 0}

  /* ---------- panel de KPIs (vista Panel) ---------- */
  .dwrap{max-width:1180px;margin:0 auto;padding:22px 28px 40px}
  .dhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .dkicker{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:10px}
  .dlive{color:var(--green);letter-spacing:.5px;text-transform:none;font-weight:700}
  .dlive::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:breathe 1.2s infinite;vertical-align:middle}
  .dlive[hidden]{display:none}
  .dtitle{font-size:24px;font-weight:800;letter-spacing:-.3px}
  .dtabs{margin-left:auto;display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .dtabs button{background:none;border:0;color:var(--dim);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600}
  .dtabs button[aria-selected=true]{background:var(--acc2);color:#fff}
  .dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .dtile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .dlabel{font-size:12.5px;color:var(--dim)} .dvalue{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
  .dsub{font-size:12px;color:var(--dim);font-weight:400}
  .dtile .dsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .dresumen{margin:16px 0 6px;color:var(--txt);font-size:15px;line-height:1.6;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
  .dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:14px}
  @media (max-width:900px){.dgrid{grid-template-columns:1fr}}
  .dgrid>section{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .dgrid h3{font-size:14px;margin:18px 0 10px;color:var(--txt)} .dgrid section>h3:first-child{margin-top:2px}
  .dbars{display:flex;flex-direction:column;gap:3px}
  .dbar{display:grid;grid-template-columns:minmax(0,40%) 1fr 36px;align-items:center;gap:10px;padding:5px 0;cursor:default}
  .dbar:hover .dbl{color:var(--txt)} .dbar:hover .dfill{filter:brightness(1.15)}
  .dbl{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dtrack{height:14px;display:flex;align-items:center}
  .dfill{height:12px;background:#8b5cf6;border-radius:0 4px 4px 0;transition:width .4s}
  .dbv{font-size:13px;color:var(--txt);font-variant-numeric:tabular-nums;text-align:right}
  .dquotes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .dquotes li{font-size:13.5px;color:var(--txt);background:var(--panel);border-left:3px solid var(--line2);border-radius:6px;padding:8px 11px;line-height:1.5}
  .dchips{display:flex;flex-wrap:wrap;gap:6px} .dchips span{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
  .dnext{margin-top:18px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.35);border-radius:11px;padding:11px 13px;font-size:13.5px;line-height:1.55}
  .dempty{font-size:14px;color:var(--dim);line-height:1.6}
  .dtip{position:fixed;z-index:60;pointer-events:none;background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--txt);max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.4)}

  @media (max-width:1180px){ .site input{width:160px} .views kbd{display:none} :root{--side:380px} }
  @media (max-width:980px){ .loc{display:none} .site{display:none} }
</style>
</head>
<body>
<header class="top">
  <div class="brandwrap">
    <span class="brand">Lazarillo</span>
    <div class="loc" id="loc">📍 cargando la web…</div>
  </div>
  <nav class="views" id="views" role="tablist" aria-label="Vista">
    <button role="tab" data-view="demo" title="Web y lateral con la llamada (1)">Demo<kbd>1</kbd></button>
    <button role="tab" data-view="web" title="Solo la web (2)">Web<kbd>2</kbd></button>
    <button role="tab" data-view="graph" title="El grafo en grande (3)">Grafo<kbd>3</kbd></button>
    <button role="tab" data-view="chat" title="Solo la conversación (4)">Conversación<kbd>4</kbd></button>
    <button role="tab" data-view="panel" title="Panel de interés en directo (5)">Panel<kbd>5</kbd></button>
  </nav>
  <div class="actions">
    <form class="site" id="siteForm">
      <input id="siteUrl" type="url" placeholder="https://cualquier-web.com" autocomplete="off" aria-label="Web a explorar">
      <button class="btn ghost" id="btnExplore" type="submit">Explorar</button>
    </form>
    <button class="icon" id="fsBtn" type="button" title="Pantalla completa (F)" aria-label="Pantalla completa">⛶</button>
    <button class="btn" id="btnStart">Empezar demo</button>
    <button class="btn ghost" id="btnStop" disabled>Colgar</button>
  </div>
</header>

<main class="stage" id="stage" data-view="demo">
  <section class="pane-web"><iframe id="site" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation" title="Web de la demo"></iframe></section>

  <aside class="side">
    <div class="callcard">
      <div class="dot" id="dot"></div>
      <div class="callinfo">
        <div class="state" id="statusText">en reposo</div>
        <div class="hint">Pulsa <b>Empezar demo</b>, permite el micro y usa <b>cascos</b>. Cuéntale qué quieres resolver: la IA te lleva.</div>
      </div>
    </div>
    <div id="warnbox"></div>

    <section class="card chatcard">
      <div class="cardhead">
        <div class="seg" role="tablist" aria-label="Qué ver">
          <button role="tab" data-feed="chat" aria-selected="true">Conversación</button>
          <button role="tab" data-feed="log" aria-selected="false">Actividad</button>
        </div>
        <a class="rep" href="#" id="btnReport" title="Panel de interés en directo (5)">Panel ▸</a>
        <button class="icon sm" type="button" data-goto="chat" title="Solo la conversación (4)" aria-label="Ver la conversación en grande">⤢</button>
      </div>
      <div class="chat" id="chat" aria-live="polite"><div class="empty" id="chatEmpty">Aquí aparecerá la conversación con el visitante.<br>Pulsa <b>Empezar demo</b> para hablar con Lazarillo.</div></div>
      <div class="log" id="log" hidden></div>
    </section>

    <section class="card graphcard">
      <div class="cardhead">
        <div class="ghead" id="ghead"><b>Grafo</b></div>
        <input class="gsearch" id="gsearch" type="search" placeholder="Buscar página o concepto…" aria-label="Buscar en el grafo" autocomplete="off">
        <div class="seg" role="tablist" aria-label="Capas del grafo">
          <button role="tab" data-gmode="pages" aria-selected="true" title="Páginas: dónde ir y qué pulsar">Páginas</button>
          <button role="tab" data-gmode="concepts" aria-selected="false" title="Conceptos: de qué habla la web">Conceptos</button>
          <button role="tab" data-gmode="both" aria-selected="false" title="Las dos capas a la vez">Ambos</button>
        </div>
        <button class="icon sm" type="button" data-goto="graph" title="El grafo en grande (3)" aria-label="Ver el grafo en grande">⤢</button>
      </div>
      <svg id="graph" aria-label="Grafo de la web"></svg>
      <div class="gfoot">
        <div id="predict" class="gprob"></div>
        <div id="ginfo"></div>
        <div class="glegend" id="glegend"></div>
      </div>
    </section>
  </aside>

  <section class="pane-dash" id="dashPane" aria-label="Panel de interés"></section>

  <div class="pill" id="pill"><div class="dot sm" id="pillDot"></div><div class="pilltext" id="pillText"><small>en reposo</small></div></div>

  <div class="fshot" id="fshot"></div>
  <nav class="fsbar" id="fsbar" aria-label="Vista en pantalla completa">
    <button data-view="demo">Demo</button><button data-view="web">Web</button><button data-view="graph">Grafo</button><button data-view="chat">Conversación</button><button data-view="panel">Panel</button>
    <button class="exit" id="fsExit" title="Salir de pantalla completa (Esc)">Salir ✕</button>
  </nav>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
