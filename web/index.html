<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lazarillo — guía de voz</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11151f;
    --panel-2: #0e121b;
    --line: #1f2633;
    --fg: #e6ebf2;
    --mut: #8a94a6;
    --accent: #5b8cff;
    --accent-2: #37d39b;
    --warn: #ffb454;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #141a28 0%, var(--bg) 60%);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 22px 28px 14px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; font-weight: 650; }
  header .tag { color: var(--mut); font-size: 13px; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 18px;
    padding: 6px 28px 28px;
    min-height: 0;
  }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .controls { gap: 16px; }
  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #0c1019;
    font-size: 15px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--mut);
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
    transition: background .2s, box-shadow .2s;
    flex: 0 0 auto;
  }
  .dot.idle    { background: #3a4252; }
  .dot.connect { background: var(--warn); animation: pulse 1.1s infinite; }
  .dot.listen  { background: var(--accent); animation: pulse 1.4s infinite; }
  .dot.speak   { background: var(--accent-2); animation: pulse .8s infinite; }
  .dot.error   { background: var(--err); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(91,140,255,.45); }
    70%  { box-shadow: 0 0 0 10px rgba(91,140,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(91,140,255,0); }
  }
  #statusText { font-weight: 550; }
  .buttons { display: flex; gap: 12px; margin-top: 4px; }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: #161c28;
    color: var(--fg);
    font: inherit;
    font-weight: 600;
    padding: 13px 18px;
    border-radius: 12px;
    cursor: pointer;
    flex: 1;
    transition: transform .06s, background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: #1c2434; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #btnStart { background: var(--accent); border-color: var(--accent); color: #0b0e14; }
  #btnStart:hover:not(:disabled) { background: #6f9bff; }
  #btnStop { background: #2a1416; border-color: #51252a; color: #ffd6d6; }
  .hint {
    margin-top: auto;
    color: var(--mut);
    font-size: 12.5px;
    padding-top: 14px;
  }
  .warnbox {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    border: 1px solid #5a4420;
    background: #1f1708;
    color: var(--warn);
    border-radius: 12px;
    font-size: 13px;
  }
  .log { flex: 1; min-height: 0; }
  .log h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--mut); font-weight: 650; }
  #log {
    flex: 1;
    overflow-y: auto;
    font: 12.5px/1.55 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    padding-right: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 62px 70px 1fr;
    gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid #141a26;
  }
  .row .t { color: #4f5a6e; }
  .row .k { font-weight: 700; }
  .row .m { color: #cdd6e4; word-break: break-word; }
  .k.evt  { color: var(--accent); }
  .k.tool { color: var(--accent-2); }
  .k.info { color: var(--mut); }
  .k.err  { color: var(--err); }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: #232c3a; border-radius: 8px; }
</style>
</head>
<body>
  <header>
    <h1>Lazarillo</h1>
    <span class="tag">guía de voz — habla con la app</span>
  </header>
  <main>
    <section class="card controls">
      <div class="status">
        <span id="dot" class="dot idle"></span>
        <span id="statusText">en reposo</span>
      </div>
      <div class="buttons">
        <button id="btnStart">Empezar demo</button>
        <button id="btnStop" disabled>Colgar</button>
      </div>
      <div id="warnbox" class="warnbox"></div>
      <p class="hint">Pulsa «Empezar demo» y habla. El agente sabe en qué pantalla estás y puede resaltar dónde pulsar.</p>
    </section>
    <section class="card log">
      <h2>Eventos y herramientas</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
